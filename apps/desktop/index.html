<!doctype html>
<html lang="zh-CN" data-starting>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ee" />
    <title>小说书库</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #f7f3ee; }
      #startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 0% 0%, #e6f7f7 0, transparent 42%), radial-gradient(ellipse at 85% 95%, #faf0f4 0, transparent 55%), #f7f3ee; transition: opacity .38s ease, visibility .38s ease; }
      .startup-splash__mark { width: 64px; height: 64px; animation: startup-appear .5s ease-out both; }
      .startup-splash__icon { display: block; width: 100%; height: 100%; overflow: visible; }
      #startup-splash.startup-splash--leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes startup-appear { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .startup-splash__mark, .startup-splash__sheet { animation: none; } .startup-splash__sheet { display: none; } #startup-splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-live="polite" aria-label="正在启动小说书库" aria-busy="true">
      <div class="startup-splash__mark" aria-hidden="true">
        <svg class="startup-splash__icon" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <!-- One shared paper material: the landed sheet and page below match. -->
            <linearGradient id="paper" x1="32" y1="16" x2="32" y2="50" gradientUnits="userSpaceOnUse"><stop stop-color="#f8f5ef"/><stop offset="1" stop-color="#efebe4"/></linearGradient>
          </defs>
          <!-- Quiet cover and page block remain fixed throughout the turn. -->
          <path d="M7 22 Q20 18 32 25 Q44 21 57 22 L57 50 Q44 50 32 54 Q20 48 7 51 Z" fill="#d6d2cc" stroke="#b9b4ad" stroke-width="1.2"/>
          <!-- A slightly fuller stack on the left, without changing the turning surface. -->
          <path d="M8 48 Q20 45 31 52" stroke="#eeeae4" stroke-width=".8"/>
          <path class="startup-splash__left-page" d="M32 22 C25 18 16 17 8 19 C8 27 8 37 8 46 C17 44 24 46 32 50 Z" fill="url(#paper)" stroke="#bdb6ac" stroke-width=".85"/>
          <path class="startup-splash__right-page" d="M32 22 C40 20 48 19 56 20 C56 28 56 38 56 48 C48 47 40 48 32 50 Z" fill="url(#paper)" stroke="#bdb6ac" stroke-width=".85"/>
          <path class="startup-splash__sheet" d="M32 22 C40 20 48 19 56 20 C56 28 56 38 56 48 C48 47 40 48 32 50 Z" fill="url(#paper)" stroke="#bdb6ac" stroke-width=".85"/>
          <!-- Fixed logo bookmark: paint above the animated sheet so it never blinks out. -->
          <path class="startup-splash__bookmark" d="M46 19.5 L50 19.5 L50 29 L48 27.5 L46 29 Z" fill="#b6aaa1"/>
        </svg>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
