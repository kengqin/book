name: Quality checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck and build desktop web assets
        run: npm run desktop:web:build

      - name: Build online reading site
        run: npm run web:build

      - name: Typecheck and build mobile web assets
        run: npm run mobile:web:build

      - name: Validate Android release metadata
        run: npm run mobile:release:validate

      - name: Validate IDE integrations
        run: npm run plugins:validate

  native:
    name: Native checks
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/local-runtime

      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check local Runtime Rust formatting
        run: cargo fmt --manifest-path apps/local-runtime/Cargo.toml -- --check

      - name: Lint desktop Rust
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Lint local Runtime Rust
        run: cargo clippy --manifest-path apps/local-runtime/Cargo.toml --all-targets -- -D warnings

      - name: Run desktop Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run local Runtime Rust tests
        run: cargo test --manifest-path apps/local-runtime/Cargo.toml
